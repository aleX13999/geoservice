networks:
    geo_internal_network:
        name: geo_internal_network
        ipam:
            config:
                # доступные адреса 172.30.0.1 - 172.30.0.14
                - subnet: 172.30.0.0/28

services:
    geo-php-fpm:
        container_name: geo-php-fpm
        build:
            context: docker/php
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        volumes:
            - ./:/var/www
            - /var/www/node_modules
        networks:
            geo_internal_network:
                ipv4_address: 172.30.0.2

    nginx:
        container_name: geo-nginx
        build: docker/nginx
        volumes:
            - ./:/var/www
            - ./var/logs/nginx:/var/log/nginx
            - ./docker/nginx/conf.d/nginx.conf:/etc/nginx/conf.d/default.conf
        ports:
            - "${NGINX_HOST}:${NGINX_HTTP_PORT}:80"
        networks:
            geo_internal_network:
                ipv4_address: 172.30.0.3
        depends_on:
            - geo-php-fpm
        environment:
            NGINX_RATE: 60
            NGINX_BURST: 10

    mysql:
        image: mysql:8.0
        command: ['mysqld', '--lower-case-table-names=1']
        container_name: geo-mysql
        cap_add:
            - SYS_NICE
        volumes:
            - ./var/data/mysql:/var/lib/mysql
            - ./var/logs/mysql:/var/log/mysql
            - ./docker/mysql/initdb.d:/docker-entrypoint-initdb.d
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
        ports:
            - "${MYSQL_HOST}:${MYSQL_PORT}:3306"
        networks:
            geo_internal_network:
                ipv4_address: 172.30.0.4
